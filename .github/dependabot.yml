version: 2
updates:
  - package-ecosystem: npm
    directory: /concursosagora-main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependabot
      - frontend
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
          - '@next/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      sanity:
        patterns:
          - '@sanity/*'
          - sanity
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: npm
    directory: /concursos-sanity-backend
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependabot
      - backend

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependabot
      - ci
