# Fontes monitoradas pelo pipeline.
# Apenas sites públicos, sem login, paywall ou CAPTCHA.
# Somente fontes com tier official_primary/official_secondary e usage article
# podem gerar rascunhos. Fontes de imprensa/agregadores entram como
# tier: journalism e usage: discovery (apenas descoberta, sem geração de artigo).
sources:
  - id: inss
    name: INSS
    type: govbr_news
    enabled: true
    tier: official_primary
    usage: article
    start_urls:
      - https://www.gov.br/inss/pt-br/assuntos/noticias
    allowed_domains:
      - www.gov.br
      - gov.br
    link_pattern: "/inss/pt-br/assuntos/noticias/"
    include_keywords:
      - concurso
      - vagas
      - edital
      - processo-seletivo
      - nomeacao
      - convocacao
      - autoriza
      - carreira
      - servidor
      - cpnu
      - cargo
      - analista
      - tecnico
    exclude_keywords:
      - atendimento
      - calendario
      - pagamento
      - beneficio
      - pericia
      - prova-de-vida
      - prevbarco
      - golpe
      - fraude
      - mutirao
      - agencia
      - agencias
      - 13o
      - salario-maternidade
      - auxilio
      - aposentadoria
      - revisao
      - emprestimo
      - consignado
      - desconto
      - extrato
      - declaracao
      - imposto
      - inscricao-do-meu
    default_categories:
      - nacional
      - federal
    default_organ: Instituto Nacional do Seguro Social (INSS)
    default_sphere: FEDERAL
    max_candidates: 30

  - id: vunesp
    name: Fundação Vunesp
    type: vunesp
    enabled: true
    tier: official_primary
    usage: article
    start_urls:
      - https://www.vunesp.com.br/busca/concurso/inscricoes%20abertas
    allowed_domains:
      - www.vunesp.com.br
      - vunesp.com.br
    link_pattern: "^/[A-Za-z]{2,8}\\d{3,6}$"
    preferred_keywords:
      - publico
      - federal
      - universidade
      - prefeitura
      - tribunal
      - ministerio
      - policia
      - saude
      - professor
    default_categories: []
    max_candidates: 12

  - id: fgv
    name: FGV Conhecimento
    type: fgv
    enabled: true
    tier: official_primary
    usage: article
    start_urls:
      - https://conhecimento.fgv.br/concursos
    allowed_domains:
      - conhecimento.fgv.br
    preferred_keywords:
      - policia
      - tribunal
      - ministerio
      - prefeitura
      - universidade
      - federal
      - concurso publico
    default_categories: []
    max_candidates: 30

  # Fonte genérica para notícias oficiais de prefeituras, institutos federais
  # e universidades que publicam concursos em páginas próprias. Serve para
  # URLs diretas informadas via --url; a descoberta automática depende de
  # start_urls.
  - id: govbr_municipal
    name: Órgãos Públicos — Notícias Oficiais
    type: govbr_news
    enabled: true
    tier: official_primary
    usage: article
    start_urls: []
    allowed_domains:
      - holambra.sp.gov.br
      - aparecida.sp.gov.br
      - veracruz.sp.gov.br
      - saojoaquimdabarra.sp.gov.br
      - saojoaquim.sc.gov.br
      - barrabonita.sp.gov.br
      - contagem.mg.gov.br
      - bariri.sp.gov.br
      - promissao.sp.gov.br
      - ariranha.sp.gov.br
      - itapecerica.sp.gov.br
      - etecpolivalente.cps.sp.gov.br
      - piedade.sp.gov.br
      - curitiba.pr.gov.br
      - maua.sp.gov.br
      - paulodefrontin.rj.gov.br
      - casabranca.sp.gov.br
      - morroreuter.rs.gov.br
      - macaubal.sp.gov.br
      - ciop.sp.gov.br
      - salto.sp.gov.br
      - saomiguelarcanjo.sp.gov.br
      - ifsp.edu.br
      - ifmg.edu.br
      - ifsuldeminas.edu.br
      - ifap.edu.br
      - univasf.edu.br
      - ifsc.edu.br
      - ufnt.edu.br
    include_keywords:
      - concurso
      - edital
      - vagas
      - inscricoes
      - processo seletivo
    exclude_keywords:
      - licitacao
      - pregao
      - contrato
      - cookie
      - cookies
      - lgpd
      - politica de privacidade
      - termo de uso
      - banner
      - consentimento
    default_categories: []
    max_candidates: 20
    options:
      strict_extraction: true

  # O DOU bloqueia todo o site no robots.txt (User-agent: * / Disallow: /).
  # O conector lê XML/ZIP oficial baixado manualmente (Portal de Dados Abertos/
  # INLABS). Ele não faz login, não raspa o HTML e fica desativado por padrão.
  - id: dou
    name: Diário Oficial da União
    type: dou_inlabs
    enabled: false
    tier: official_primary
    usage: article
    start_urls: []
    allowed_domains:
      - www.in.gov.br
      - in.gov.br
      - inlabs.in.gov.br
      - dados.gov.br
    section: do3
    include_keywords:
      - concurso publico
      - processo seletivo
      - selecao publica
      - provimento de vagas
      - preenchimento de vagas
      - abertura de inscricoes
    exclude_keywords:
      - licitacao
      - pregao
      - contrato
      - termo aditivo
      - doacao
      - convenio
      - chamada publica
      - credenciamento
      - extrato de contrato
    default_categories:
      - nacional
      - federal
    default_sphere: FEDERAL
    max_candidates: 40
    options:
      import_dir: data/dou
      open_data_page: https://www.in.gov.br/acesso-a-informacao/dados-abertos/base-de-dados
      note: >-
        Baixe o XML/ZIP oficial no Portal de Dados Abertos ou no INLABS e use
        discover/run com --dou-file. Não coletar o HTML do in.gov.br.

